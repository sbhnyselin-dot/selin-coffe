{% extends "base.html" %}

{% block title %}
Login — Selin Coffee
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <span class="eyebrow">
            WELCOME BACK
        </span>

        <h1>
            Sign in.
        </h1>

        <p>
            Continue your Selin Coffee experience.
        </p>

        <form
            method="post"
            class="checkout-form"
        >

            {% csrf_token %}

            {% if form.errors %}

                <div class="form-errors">
                    Your username or password was incorrect.
                </div>

            {% endif %}

            <div class="form-group">

                <label for="id_username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    class="form-control"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="id_password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    class="form-control"
                    autocomplete="current-password"
                    required
                >

            </div>

            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >

            <button
                type="submit"
                class="btn btn-primary full-width"
            >
                Sign in →
            </button>

        </form>

    </div>

</section>

{% endblock %}
